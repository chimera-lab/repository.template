name: General Issue
description: Open a general discussion or issue
body:
  - type: markdown
    attributes:
      value: |
        ### Description
        Describe your issue or topic.
        
  - type: textarea
    id: description
    attributes:
      label: Details
      description: Please provide details about your issue
    validations:
      required: true
      
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information
