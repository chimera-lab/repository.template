name: Bug Report
description: Report a bug or issue
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Description
        Provide a clear and concise description of the bug.
        
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Step 1
        2. Step 2
        3. ...
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
      
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS:
        - Version:
        - Other relevant info:
      
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots
      
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem
